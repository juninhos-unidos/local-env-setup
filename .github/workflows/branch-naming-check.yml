name: "Assert Branch Naming Convention"

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        run: |
          export PATTERN="^(feat|feature|fix|docs|style|refactor|refact|perf|test|build|chore|ci|revert|deps)\/task-[0-9]+\/[a-zA-Z0-9-].{1,100}$"
          export BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          
          if [[ ! $BRANCH_NAME =~ $PATTERN ]]; then
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "❌ ERRO: O nome da branch '$BRANCH_NAME' está fora do padrão!"
            echo ""
            echo "O padrão obrigatório agora é: <tipo>/task-<numero>/<descricao>"
            echo ""
            echo "Tipos permitidos:"
            echo "  feat, feature, fix, docs, style, refactor, refact, perf, test, build, chore, ci, revert, deps"
            echo ""
            echo "Exemplos de nomes corretos conforme sua solicitação:"
            echo "  feat/task-1/adicionar-calculo-seguro"
            echo "  fix/task-2/corrigir-erro-validacao"
            echo "  docs/task-3/atualizar-readme-projeto"
            echo ""
            echo "Como resolver:"
            echo "  1. No seu terminal: git branch -m tipo/task-numero/descricao-curta"
            echo "  2. Envie a nova branch: git push origin tipo/task-numero/descricao-curta"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          else
            echo "✅ Excelente! A branch '$BRANCH_NAME' segue o padrão de rastreabilidade."
          fi